name: SDK & Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: TypeScript Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Build and test SDK
        run: npm run test --workspace=@aegis-protocol/sdk

      - name: Build repo watcher
        run: npm run build --workspace=@aegis-protocol/repo-watcher

      - name: Build web app
        run: npm run build --workspace=@aegis-protocol/web
